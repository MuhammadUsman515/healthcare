{% extends 'base.html' %}
{% block title %}Edit Medicine - MediCare HMS{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('main.dashboard') }}">Home</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('pharmacy.index') }}">Pharmacy</a></li>
<li class="breadcrumb-item active">Edit</li>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="fas fa-edit me-2 text-primary"></i>Edit: {{ medicine.name }}</h4>
    <a href="{{ url_for('pharmacy.index') }}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Back</a>
</div>
<div class="row justify-content-center">
    <div class="col-lg-8">
        <form method="POST">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Medicine Name *</label><input type="text" name="name" class="form-control" value="{{ medicine.name }}" required></div>
                        <div class="col-md-6"><label class="form-label">Generic Name</label><input type="text" name="generic_name" class="form-control" value="{{ medicine.generic_name or '' }}"></div>
                        <div class="col-md-6"><label class="form-label">Category</label><input type="text" name="category" class="form-control" value="{{ medicine.category or '' }}"></div>
                        <div class="col-md-6"><label class="form-label">Manufacturer</label><input type="text" name="manufacturer" class="form-control" value="{{ medicine.manufacturer or '' }}"></div>
                        <div class="col-md-4"><label class="form-label">Unit</label><input type="text" name="unit" class="form-control" value="{{ medicine.unit or '' }}"></div>
                        <div class="col-md-4"><label class="form-label">Unit Price ($)</label><input type="number" name="unit_price" class="form-control" step="0.01" value="{{ medicine.unit_price }}"></div>
                        <div class="col-md-4"><label class="form-label">Stock Quantity</label><input type="number" name="stock_quantity" class="form-control" value="{{ medicine.stock_quantity }}"></div>
                        <div class="col-md-6"><label class="form-label">Reorder Level</label><input type="number" name="reorder_level" class="form-control" value="{{ medicine.reorder_level }}"></div>
                        <div class="col-md-6"><label class="form-label">Expiry Date</label><input type="date" name="expiry_date" class="form-control" value="{{ medicine.expiry_date.strftime('%Y-%m-%d') if medicine.expiry_date else '' }}"></div>
                        <div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2">{{ medicine.description or '' }}</textarea></div>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <button type="submit" class="btn btn-primary me-2"><i class="fas fa-save me-2"></i>Save Changes</button>
                    <a href="{{ url_for('pharmacy.index') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

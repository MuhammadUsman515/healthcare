{% extends "base.html" %}
{% block title %}Step 1 — Organization Profile{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:600px">
  <h4 class="fw-bold mb-1"><i class="fas fa-building me-2 text-primary"></i>Step 1: Organization Profile</h4>
  <p class="text-muted mb-4">Tell us about your clinic or hospital.</p>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-semibold">Organization Name *</label>
      <input type="text" name="name" class="form-control" value="{{ org.name }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Address</label>
      <textarea name="address" class="form-control" rows="2">{{ org.address or '' }}</textarea>
    </div>
    <div class="row g-2">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">Phone</label>
        <input type="text" name="contact_phone" class="form-control" value="{{ org.contact_phone or '' }}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">Country</label>
        <input type="text" name="country" class="form-control" value="{{ org.country or 'Pakistan' }}">
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Currency</label>
      <select name="currency" class="form-select">
        {% for code in ['PKR','USD','SAR','AED','EUR','GBP','INR','BDT'] %}
        <option value="{{ code }}" {% if org.currency==code %}selected{% endif %}>{{ code }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="d-flex justify-content-between">
      <a href="{{ url_for('onboarding.index') }}" class="btn btn-outline-secondary">← Back</a>
      <button class="btn btn-primary px-4">Save & Continue →</button>
    </div>
  </form>
</div>
{% endblock %}

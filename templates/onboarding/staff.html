{% extends "base.html" %}
{% block title %}Step 6 — Invite Staff{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:700px">
  <h4 class="fw-bold mb-1"><i class="fas fa-users me-2 text-warning"></i>Step 6: Invite Staff</h4>
  <p class="text-muted mb-3">Add receptionists, nurses, and other staff. Default password: <code>changeme123</code></p>
  <form method="POST">
    <div id="staffList">
      <div class="row g-2 mb-2 staff-row">
        <div class="col-md-4"><input type="text" name="full_name" class="form-control" placeholder="Full Name"></div>
        <div class="col-md-4"><input type="email" name="email" class="form-control" placeholder="Email"></div>
        <div class="col-md-3">
          <select name="role" class="form-select">
            <option>receptionist</option><option>nurse</option><option>pharmacist</option><option>lab_tech</option>
          </select>
        </div>
        <div class="col-md-1"><button type="button" class="btn btn-outline-danger" onclick="this.closest('.staff-row').remove()"><i class="fas fa-trash"></i></button></div>
      </div>
    </div>
    <button type="button" class="btn btn-outline-secondary btn-sm mb-4" onclick="addStaff()">
      <i class="fas fa-plus me-1"></i>Add Staff
    </button>
    <div class="d-flex justify-content-between">
      <a href="{{ url_for('onboarding.setup_schedule') }}" class="btn btn-outline-secondary">← Back</a>
      <div>
        <a href="{{ url_for('onboarding.setup_reminders') }}" class="btn btn-outline-secondary me-2">Skip</a>
        <button class="btn btn-primary px-4">Save & Continue →</button>
      </div>
    </div>
  </form>
</div>
<script>
function addStaff() {
  const row = document.querySelector('.staff-row').cloneNode(true);
  row.querySelectorAll('input').forEach(i => i.value='');
  document.getElementById('staffList').appendChild(row);
}
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Step 3 — Add Doctors{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:700px">
  <h4 class="fw-bold mb-1"><i class="fas fa-user-md me-2 text-success"></i>Step 3: Add Doctors</h4>
  <p class="text-muted mb-3">Add your doctors. You can add more later from the Doctors section.</p>

  {% if doctors %}
  <div class="alert alert-success">{{ doctors|length }} doctor(s) already added.</div>
  {% endif %}

  <form method="POST">
    <div id="doctorList">
      <div class="doctor-row border rounded p-3 mb-3 bg-light">
        <div class="row g-2">
          <div class="col-md-3"><input type="text" name="first_name" class="form-control" placeholder="First Name"></div>
          <div class="col-md-3"><input type="text" name="last_name" class="form-control" placeholder="Last Name"></div>
          <div class="col-md-3"><input type="text" name="specialization" class="form-control" placeholder="Specialization"></div>
          <div class="col-md-3"><input type="text" name="phone" class="form-control" placeholder="Phone"></div>
        </div>
        <div class="row g-2 mt-1">
          <div class="col-md-4"><input type="number" name="consultation_fee" class="form-control" placeholder="Consultation Fee"></div>
        </div>
      </div>
    </div>

    <button type="button" class="btn btn-outline-secondary btn-sm mb-4" onclick="addDoctor()">
      <i class="fas fa-plus me-1"></i>Add Another Doctor
    </button>

    <div class="d-flex justify-content-between">
      <a href="{{ url_for('onboarding.setup_branch') }}" class="btn btn-outline-secondary">← Back</a>
      <div>
        <a href="{{ url_for('onboarding.setup_services') }}" class="btn btn-outline-secondary me-2">Skip</a>
        <button class="btn btn-primary px-4">Save & Continue →</button>
      </div>
    </div>
  </form>
</div>

<script>
function addDoctor() {
  const row = document.querySelector('.doctor-row').cloneNode(true);
  row.querySelectorAll('input').forEach(i => i.value = '');
  document.getElementById('doctorList').appendChild(row);
}
</script>
{% endblock %}

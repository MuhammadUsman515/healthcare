{% extends "base.html" %}
{% block title %}Setup Complete!{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="max-width:600px">
  <div class="display-1 mb-3">🎉</div>
  <h2 class="fw-bold">{{ org.name }} is Live!</h2>
  <p class="text-muted fs-5">Your setup is complete. Welcome to MediOS.</p>
  <div class="row g-3 my-4 text-start">
    <div class="col-6">
      <div class="card border-0 shadow-sm p-3 text-center">
        <i class="fas fa-user-injured fa-2x text-primary mb-2"></i>
        <div class="fw-semibold">Add Patients</div>
      </div>
    </div>
    <div class="col-6">
      <div class="card border-0 shadow-sm p-3 text-center">
        <i class="fas fa-calendar-check fa-2x text-success mb-2"></i>
        <div class="fw-semibold">Book Appointments</div>
      </div>
    </div>
    <div class="col-6">
      <div class="card border-0 shadow-sm p-3 text-center">
        <i class="fas fa-brain fa-2x text-purple mb-2" style="color:var(--purple)"></i>
        <div class="fw-semibold">AI Business Summary</div>
      </div>
    </div>
    <div class="col-6">
      <div class="card border-0 shadow-sm p-3 text-center">
        <i class="fas fa-file-invoice-dollar fa-2x text-warning mb-2"></i>
        <div class="fw-semibold">Generate Bills</div>
      </div>
    </div>
  </div>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-success btn-lg px-5">
    <i class="fas fa-tachometer-alt me-2"></i>Go to Dashboard
  </a>
</div>
{% endblock %}

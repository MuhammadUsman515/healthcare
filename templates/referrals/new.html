{% extends 'base.html' %}
{% block title %}New Referral - MediCare HMS{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('main.dashboard') }}">Home</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('referrals.index') }}">Referrals</a></li>
<li class="breadcrumb-item active">New Referral</li>
{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="fw-bold mb-0"><i class="fas fa-share me-2 text-primary"></i>Create New Referral</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Patient <span class="text-danger">*</span></label>
                            <select name="patient_id" class="form-select" required>
                                <option value="">Select Patient</option>
                                {% for p in patients %}
                                <option value="{{ p.id }}">{{ p.full_name }} ({{ p.patient_id }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Referring Doctor <span class="text-danger">*</span></label>
                            <select name="referring_doctor_id" class="form-select" required>
                                <option value="">Select Doctor</option>
                                {% for d in doctors %}
                                <option value="{{ d.id }}">{{ d.full_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <h6 class="fw-semibold text-muted">Refer To (choose one)</h6>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Internal Doctor</label>
                            <select name="referred_to_doctor_id" class="form-select">
                                <option value="">None</option>
                                {% for d in doctors %}
                                <option value="{{ d.id }}">{{ d.full_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Internal Department</label>
                            <select name="referred_to_department_id" class="form-select">
                                <option value="">None</option>
                                {% for dept in departments %}
                                <option value="{{ dept.id }}">{{ dept.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">External Hospital</label>
                            <input type="text" name="referred_to_hospital" class="form-control" placeholder="Hospital name">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Urgency</label>
                            <select name="urgency" class="form-select">
                                <option value="routine">Routine</option>
                                <option value="urgent">Urgent</option>
                                <option value="emergency">Emergency</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Appointment Date</label>
                            <input type="date" name="appointment_date" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Reason for Referral <span class="text-danger">*</span></label>
                            <textarea name="reason" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notes</label>
                            <textarea name="notes" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane me-2"></i>Create Referral</button>
                        <a href="{{ url_for('referrals.index') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

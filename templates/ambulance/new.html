{% extends 'base.html' %}
{% block title %}Add Ambulance - MediCare HMS{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('main.dashboard') }}">Home</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('ambulance.index') }}">Ambulance</a></li>
<li class="breadcrumb-item active">Add Vehicle</li>
{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="fw-bold mb-0"><i class="fas fa-ambulance me-2 text-primary"></i>Register New Ambulance</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Vehicle Number <span class="text-danger">*</span></label>
                            <input type="text" name="vehicle_number" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Vehicle Type</label>
                            <select name="vehicle_type" class="form-select">
                                <option value="basic">Basic Life Support</option>
                                <option value="advanced">Advanced Life Support</option>
                                <option value="neonatal">Neonatal</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Driver Name</label>
                            <input type="text" name="driver_name" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Driver Phone</label>
                            <input type="text" name="driver_phone" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Status</label>
                            <select name="status" class="form-select">
                                <option value="available">Available</option>
                                <option value="maintenance">Maintenance</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Last Service Date</label>
                            <input type="date" name="last_service_date" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Equipment</label>
                            <textarea name="equipment" class="form-control" rows="3" placeholder="List equipment available in this vehicle..."></textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Register Vehicle</button>
                        <a href="{{ url_for('ambulance.index') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

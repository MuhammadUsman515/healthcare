{% extends 'base.html' %}
{% block title %}Edit Staff - MediCare HMS{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('main.dashboard') }}">Home</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('staff.index') }}">Staff</a></li>
<li class="breadcrumb-item active">Edit</li>
{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="fw-bold mb-0"><i class="fas fa-edit me-2 text-primary"></i>Edit Staff: {{ member.first_name }} {{ member.last_name }}</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label">First Name <span class="text-danger">*</span></label>
                            <input type="text" name="first_name" class="form-control" value="{{ member.first_name }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Last Name <span class="text-danger">*</span></label>
                            <input type="text" name="last_name" class="form-control" value="{{ member.last_name }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Role</label>
                            <select name="role" class="form-select">
                                <option value="nurse" {% if member.role=='nurse' %}selected{% endif %}>Nurse</option>
                                <option value="receptionist" {% if member.role=='receptionist' %}selected{% endif %}>Receptionist</option>
                                <option value="pharmacist" {% if member.role=='pharmacist' %}selected{% endif %}>Pharmacist</option>
                                <option value="lab_tech" {% if member.role=='lab_tech' %}selected{% endif %}>Lab Technician</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ member.email or '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control" value="{{ member.phone or '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Department</label>
                            <select name="department_id" class="form-select">
                                <option value="">Select Department</option>
                                {% for dept in departments %}
                                <option value="{{ dept.id }}" {% if member.department_id==dept.id %}selected{% endif %}>{{ dept.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Shift</label>
                            <select name="shift" class="form-select">
                                <option value="">Select Shift</option>
                                <option value="morning" {% if member.shift=='morning' %}selected{% endif %}>Morning</option>
                                <option value="afternoon" {% if member.shift=='afternoon' %}selected{% endif %}>Afternoon</option>
                                <option value="night" {% if member.shift=='night' %}selected{% endif %}>Night</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Join Date</label>
                            <input type="date" name="join_date" class="form-control" value="{{ member.join_date.strftime('%Y-%m-%d') if member.join_date else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Salary</label>
                            <input type="number" name="salary" class="form-control" step="0.01" value="{{ member.salary or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Qualification</label>
                            <input type="text" name="qualification" class="form-control" value="{{ member.qualification or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Status</label>
                            <select name="status" class="form-select">
                                <option value="active" {% if member.status=='active' %}selected{% endif %}>Active</option>
                                <option value="inactive" {% if member.status=='inactive' %}selected{% endif %}>Inactive</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="2">{{ member.address or '' }}</textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Emergency Contact</label>
                            <input type="text" name="emergency_contact" class="form-control" value="{{ member.emergency_contact or '' }}">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Save Changes</button>
                        <a href="{{ url_for('staff.view', id=member.id) }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

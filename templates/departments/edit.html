{% extends 'base.html' %}
{% block title %}Edit Department - MediCare HMS{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('main.dashboard') }}">Home</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('departments.index') }}">Departments</a></li>
<li class="breadcrumb-item active">Edit</li>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="fas fa-edit me-2 text-primary"></i>Edit: {{ dept.name }}</h4>
    <a href="{{ url_for('departments.index') }}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Back</a>
</div>
<div class="row justify-content-center">
    <div class="col-lg-6">
        <form method="POST">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Department Name *</label>
                        <input type="text" name="name" class="form-control" value="{{ dept.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ dept.description or '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Head Doctor</label>
                        <select name="head_doctor_id" class="form-select">
                            <option value="">No Head Doctor</option>
                            {% for doc in doctors %}
                            <option value="{{ doc.id }}" {% if dept.head_doctor_id == doc.id %}selected{% endif %}>{{ doc.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <button type="submit" class="btn btn-primary me-2"><i class="fas fa-save me-2"></i>Save Changes</button>
                    <a href="{{ url_for('departments.index') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

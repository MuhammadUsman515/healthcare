{% extends 'base.html' %}
{% block title %}Add Ward - MediCare HMS{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('main.dashboard') }}">Home</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('wards.index') }}">Wards</a></li>
<li class="breadcrumb-item active">Add Ward</li>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="fas fa-plus me-2 text-primary"></i>Add Ward</h4>
    <a href="{{ url_for('wards.index') }}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Back</a>
</div>
<div class="row justify-content-center">
    <div class="col-lg-6">
        <form method="POST">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-12"><label class="form-label">Ward Name *</label><input type="text" name="name" class="form-control" required placeholder="e.g. General Ward A"></div>
                        <div class="col-md-6">
                            <label class="form-label">Ward Type</label>
                            <select name="ward_type" class="form-select">
                                <option value="general">General</option>
                                <option value="icu">ICU</option>
                                <option value="private">Private</option>
                                <option value="semi-private">Semi-Private</option>
                                <option value="emergency">Emergency</option>
                                <option value="pediatric">Pediatric</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Department</label>
                            <select name="department_id" class="form-select">
                                <option value="">No Department</option>
                                {% for dept in departments %}
                                <option value="{{ dept.id }}">{{ dept.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6"><label class="form-label">Number of Beds</label><input type="number" name="total_beds" class="form-control" min="0" value="10"></div>
                        <div class="col-md-6"><label class="form-label">Daily Rate ($ per bed)</label><input type="number" name="daily_rate" class="form-control" min="0" step="0.01" value="0"></div>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <button type="submit" class="btn btn-primary me-2"><i class="fas fa-save me-2"></i>Create Ward</button>
                    <a href="{{ url_for('wards.index') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

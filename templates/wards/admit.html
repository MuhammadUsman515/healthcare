{% extends 'base.html' %}
{% block title %}Admit Patient - MediCare HMS{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('main.dashboard') }}">Home</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('wards.admissions') }}">Admissions</a></li>
<li class="breadcrumb-item active">Admit Patient</li>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="fas fa-user-plus me-2 text-primary"></i>Admit Patient</h4>
    <a href="{{ url_for('wards.admissions') }}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Back</a>
</div>
<div class="row justify-content-center">
    <div class="col-lg-7">
        <form method="POST">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Patient *</label>
                            <select name="patient_id" class="form-select" required>
                                <option value="">Select Patient...</option>
                                {% for p in patients %}
                                <option value="{{ p.id }}">{{ p.full_name }} ({{ p.patient_id }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Admitting Doctor</label>
                            <select name="doctor_id" class="form-select">
                                <option value="">Select Doctor...</option>
                                {% for doc in doctors %}
                                <option value="{{ doc.id }}">{{ doc.full_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Assign Bed</label>
                            <select name="bed_id" class="form-select">
                                <option value="">No Bed Assigned</option>
                                {% for bed in available_beds %}
                                <option value="{{ bed.id }}">{{ bed.ward.name }} - {{ bed.bed_number }}</option>
                                {% endfor %}
                            </select>
                            <small class="text-muted">{{ available_beds|length }} beds available</small>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Diagnosis / Reason for Admission</label>
                            <textarea name="diagnosis" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notes</label>
                            <textarea name="notes" class="form-control" rows="2"></textarea>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <button type="submit" class="btn btn-primary me-2"><i class="fas fa-save me-2"></i>Admit Patient</button>
                    <a href="{{ url_for('wards.admissions') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

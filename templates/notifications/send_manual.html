{% extends "base.html" %}
{% block title %}Send Manual Notification{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:600px">
  <h4 class="fw-bold mb-4"><i class="fas fa-paper-plane me-2 text-success"></i>Send Manual Notification</h4>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-semibold">Patient (optional)</label>
      <select name="patient_id" class="form-select">
        <option value="">— Select Patient —</option>
        {% for p in patients %}
        <option value="{{ p.id }}">{{ p.full_name }} — {{ p.phone }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Or Enter Recipient Directly</label>
      <input type="text" name="recipient" class="form-control" placeholder="Phone number or email">
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Channel</label>
      <select name="channel" class="form-select">
        <option value="sms">SMS</option>
        <option value="whatsapp">WhatsApp</option>
        <option value="email">Email</option>
      </select>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Message</label>
      <textarea name="message" class="form-control" rows="4" required></textarea>
    </div>
    <div class="d-flex justify-content-between">
      <a href="{{ url_for('notifications.index') }}" class="btn btn-outline-secondary">← Back</a>
      <button class="btn btn-success px-4"><i class="fas fa-paper-plane me-1"></i>Send</button>
    </div>
  </form>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Apply Leave{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('main.dashboard') }}">Home</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('hr.leaves') }}">Leaves</a></li>
<li class="breadcrumb-item active">Apply</li>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="fw-bold mb-0"><i class="fas fa-calendar-plus me-2 text-primary"></i>Apply for Leave</h5>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Staff Member <span class="text-danger">*</span></label>
            <select name="staff_id" class="form-select" required>
              <option value="">-- Select --</option>
              {% for s in staff_list %}
              <option value="{{ s.id }}">{{ s.full_name }} — {{ s.role|replace('_',' ')|title }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Leave Type <span class="text-danger">*</span></label>
            <select name="leave_type" class="form-select" required>
              <option value="sick">Sick Leave</option>
              <option value="annual">Annual Leave</option>
              <option value="casual">Casual Leave</option>
              <option value="emergency">Emergency Leave</option>
              <option value="maternity">Maternity / Paternity</option>
              <option value="unpaid">Unpaid Leave</option>
            </select>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label fw-semibold">From Date <span class="text-danger">*</span></label>
              <input type="date" name="from_date" class="form-control" value="{{ today.isoformat() }}" required>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">To Date <span class="text-danger">*</span></label>
              <input type="date" name="to_date" class="form-control" value="{{ today.isoformat() }}" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Reason</label>
            <textarea name="reason" class="form-control" rows="3" placeholder="Reason for leave..."></textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Submit Application</button>
            <a href="{{ url_for('hr.leaves') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

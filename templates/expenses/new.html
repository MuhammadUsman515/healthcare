{% extends 'base.html' %}
{% block title %}Add Expense{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('main.dashboard') }}">Home</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('expenses.index') }}">Expenses</a></li>
<li class="breadcrumb-item active">New</li>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="fw-bold mb-0"><i class="fas fa-plus me-2 text-danger"></i>Add Expense</h5>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
            <input type="text" name="title" class="form-control" placeholder="e.g. Electricity Bill, Medicines Purchase..." required>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label fw-semibold">Amount (Rs.) <span class="text-danger">*</span></label>
              <input type="number" name="amount" class="form-control" min="0" step="1" placeholder="0" required>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
              <input type="date" name="expense_date" class="form-control" value="{{ today.isoformat() }}" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Category</label>
            <select name="category_id" class="form-select">
              <option value="">-- No Category --</option>
              {% for c in categories %}
              <option value="{{ c.id }}">{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label fw-semibold">Payment Method</label>
              <select name="payment_method" class="form-select">
                <option value="cash">Cash</option>
                <option value="bank">Bank Transfer</option>
                <option value="cheque">Cheque</option>
                <option value="online">Online</option>
                <option value="card">Card</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">Invoice #</label>
              <input type="text" name="invoice_number" class="form-control" placeholder="Optional">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Vendor / Supplier</label>
            <input type="text" name="vendor" class="form-control" placeholder="Vendor name">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Notes</label>
            <textarea name="notes" class="form-control" rows="2"></textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Save Expense</button>
            <a href="{{ url_for('expenses.index') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
